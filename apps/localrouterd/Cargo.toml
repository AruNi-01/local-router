[package]
name = "localrouterd"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["ws", "macros"] }
include_dir = "0.7.4"
localrouter-core = { path = "../../crates/localrouter-core" }
mime_guess = "2.0.5"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
